# ruff.toml
target-version = "py312"
line-length = 88
extend-exclude = [
    "migrations",
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "staticfiles",
    "media",
    "logs",
    "backups",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "S",    # flake8-bandit (安全)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (由 formatter 处理)
    "S101",   # assert 用于测试没问题
    "S104",   # hardcoded bind all interfaces (Docker 里常见)
    "S105",   # hardcoded password (dev 里常见)
    "S106",   # hardcoded password in func arg
    "S107",   # hardcoded password default
    "S108",   # hardcoded /tmp (测试环境常见)
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    "S113",   # request without timeout
    "S301",   # pickle (如果不用可以保留)
    "S310",   # urllib 不安全 URL
    "S311",   # random 不加密用途
    "S324",   # hashlib 弱哈希
    "S501",   # verify=False
    "S603",   # subprocess call
    "S607",   # subprocess partial path
    "S701",   # jinja2 autoescape
    "DJ001",  # 允许 null=True on CharField
    "DJ008",  # __str__ 检查
    "RUF001", # 字符串里的 unicode
    "RUF002", # docstring 里的 unicode
    "RUF003", # 注释里的 unicode
    "T201",   # print 语句（Django management command 允许）
    "RUF012", # Django admin/forms/DRF class declarations intentionally use class attributes
    "E402",   # legacy split-module compatibility files keep section-local imports
]

[lint.per-file-ignores]
"**/tests/**" = ["S", "T20", "E501"]
"**/test_*.py" = ["S", "T20", "E501"]
"**/settings/*.py" = ["F405", "F403", "S105", "S106"]
"**/migrations/*.py" = ["E501", "F401"]
"manage.py" = ["T20"]
"**/management/commands/*.py" = ["T20"]

[lint.isort]
known-first-party = ["blog", "images", "users", "my_site"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true