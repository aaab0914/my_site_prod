# ============================================================
# 默认 server：拒绝所有非正式域名的请求（HTTP 和 HTTPS 都拒绝）
# 这样 caasone.xyz、51crm.wxin.org 等域名不会进 Django
# ============================================================
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 直接断开连接，不返回任何内容，最省资源
    return 444;
}

# ============================================================
# 正式站点：HTTP → HTTPS 跳转
# ============================================================
server {
    listen 80;
    server_name rgavanp.kdns.fr www.rgavanp.kdns.fr;

    # 扫描路径直接拒绝
    include /etc/nginx/conf.d/block-scanners.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# 正式站点：HTTPS
# ============================================================
server {
    listen 443 ssl http2;
    server_name rgavanp.kdns.fr www.rgavanp.kdns.fr;

    client_max_body_size 105m;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $django_upstream http://web:8000;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    keepalive_timeout 65;
    keepalive_requests 1000;

    access_log /var/log/nginx-access/access.log;
    error_log  /var/log/nginx-error/error.log warn;

    # ---------- 扫描路径拦截（放在最前面，优先级最高） ----------
    include /etc/nginx/conf.d/block-scanners.conf;

    # 内部指标不暴露
    location = /metrics { return 404; }
    location = /robots.txt { return 404; }

    # ---------- 静态文件 ----------
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, max-age=7776000, immutable";
        access_log off;
    }

    location /media/ {
        return 404;
    }

    location /_protected_media/ {
        internal;
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, max-age=7776000, immutable";
        access_log off;
    }

    # ---------- 大文件上传（单独超时） ----------
    location ~ ^/blog/(?:audio|video)/upload/$ {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    # ---------- /app/ 前缀重写 ----------
    location /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    # ---------- 默认转发 ----------
    location / {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }
}