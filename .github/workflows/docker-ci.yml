name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff coverage pip-audit

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true   # 不阻塞，只提示

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI env file
        run: |
          cat > .env.dev <<EOF
          SECRET_KEY=ci-secret-key
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DB_NAME=my_site_db
          DB_USER=my_site_user
          DB_PASSWORD=StrongPass123!
          DB_HOST=db
          DB_PORT=5432
          RUNNING_IN_DOCKER=true
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          EOF
          cat > .env.prod <<EOF
          SECRET_KEY=ci-secret-key-prod
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=http://localhost
          DB_NAME=my_site_db
          DB_USER=my_site_user
          DB_PASSWORD=StrongPass123!
          DB_HOST=db
          DB_PORT=5432
          SECURE_SSL_REDIRECT=False
          SESSION_COOKIE_SECURE=False
          CSRF_COOKIE_SECURE=False
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          RUNNING_IN_DOCKER=true
          EOF

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml config

      - name: Build containers
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml build

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Start stack
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml up -d

      - name: Wait for web health
        run: |
          for i in {1..24}; do
            status="$(docker inspect --format='{{json .State.Health.Status}}' "$(docker compose --env-file .env.dev -f docker-compose.dev.yml ps -q web)" 2>/dev/null || true)"
            if [ "$status" = "\"healthy\"" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env.dev -f docker-compose.dev.yml ps
          docker compose --env-file .env.dev -f docker-compose.dev.yml logs web db redis celery celery-beat
          exit 1

      - name: Django check
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml exec -T web python manage.py check

      - name: Django deploy check
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml exec -T web python manage.py check --deploy
        continue-on-error: true

      - name: Django migrations check
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml exec -T web python manage.py makemigrations --check --dry-run

      - name: Run Django test suite with coverage
        run: |
          docker compose --env-file .env.dev -f docker-compose.dev.yml exec -T web sh -c "
            pip install coverage && \
            coverage run --source='.' manage.py test && \
            coverage report --fail-under=60
          "

      - name: Verify nginx endpoint
        run: |
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8001/blog/

      - name: Run health monitor probe
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml exec -T web python /code/monitor_health.py

      - name: Validate production compose config
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml config

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.dev -f docker-compose.dev.yml down -v