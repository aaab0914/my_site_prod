services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: my_site.settings.prod
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      RUNNING_IN_DOCKER: ${RUNNING_IN_DOCKER}
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/code/staticfiles
      - ./media:/code/media
      - ./logs:/code/logs
      - ./backups:/code/backups
      - ./my_site/templates:/code/my_site/templates:ro
      - ./blog/templates:/code/blog/templates:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\nopener = urllib.request.build_opener(NoRedirect)\nreq = urllib.request.Request('http://127.0.0.1:8000/users/login/', headers={'X-Forwarded-Proto': 'https', 'Host': 'localhost'})\nresponse = opener.open(req, timeout=15)\nprint(response.status)\nPY"]
      interval: 15s
      timeout: 15s
      start_period: 30s
      retries: 8

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env.prod
    command: celery -A my_site worker -l info -E --concurrency=1
    environment:
      DJANGO_SETTINGS_MODULE: my_site.settings.prod
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      RUNNING_IN_DOCKER: ${RUNNING_IN_DOCKER}
    volumes:
      - ./logs:/code/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport socket\nimport subprocess\nhost = socket.gethostname()\nresult = subprocess.run(['celery', '-A', 'my_site', 'inspect', 'ping', '-d', f'celery@{host}'], capture_output=True, text=True, timeout=20)\noutput = f'{result.stdout}\\n{result.stderr}'\nraise SystemExit(0 if result.returncode == 0 and 'pong' in output else 1)\nPY"]
      interval: 30s
      timeout: 25s
      start_period: 40s
      retries: 3

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env.prod
    command: celery -A my_site beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: my_site.settings.prod
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      RUNNING_IN_DOCKER: ${RUNNING_IN_DOCKER}
    volumes:
      - ./logs:/code/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nfrom pathlib import Path\ncmdline = Path('/proc/1/cmdline').read_text(encoding='utf-8', errors='ignore').replace('\\x00', ' ')\nraise SystemExit(0 if 'celery' in cmdline and 'beat' in cmdline else 1)\nPY"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  flower:
    profiles: ["optional"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env.prod
    command: celery -A my_site flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:change-me}
    environment:
      DJANGO_SETTINGS_MODULE: my_site.settings.prod
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      RUNNING_IN_DOCKER: ${RUNNING_IN_DOCKER}
    volumes:
      - ./logs:/code/logs
    ports:
      - "127.0.0.1:15556:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_healthy

  nginx:
    profiles: ["optional"]
    image: nginx:1.25
    restart: always
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./block-scanners.conf:/etc/nginx/conf.d/block-scanners.conf:ro
      - ./staticfiles:/static:ro
      - ./media:/media:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx-access:/var/log/nginx-access
      - ./logs/nginx-error:/var/log/nginx-error
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: