{% extends "blog/base.html" %}

{% block title %}Edit Image{% endblock %}

{% block content %}
{% include "images/includes/gallery_shared_css.html" %}
<style>
    .gallery-edit {
        max-width: 760px;
        margin: 0 auto 32px;
        padding: 24px;
    }

    .gallery-edit h1 {
        margin-top: 0;
    }

    .gallery-edit label {
        float: none;
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
    }

    .gallery-edit input,
    .gallery-edit textarea {
        width: 100%;
        float: none;
        margin: 0 0 16px;
        padding: 12px 14px;
        border: 1px solid #cbd6e1;
        border-radius: 14px;
        background: #f8fbfd;
        font-size: 14px;
        box-sizing: border-box;
    }

    .gallery-edit-actions {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .gallery-edit-save,
    .gallery-edit-cancel {
        display: inline-block;
    }
</style>

<section class="gallery-edit gallery-card-surface">
    <h1>Edit Image</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="gallery-edit-actions">
            <button class="gallery-edit-save gallery-pill-button is-primary" type="submit">Save</button>
            <a class="gallery-edit-cancel gallery-pill-button is-neutral" href="{% url 'blog:images:gallery_detail' image.id %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
