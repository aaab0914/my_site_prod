server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 38.76.217.137 rgavanp.kdns.fr;

    client_max_body_size 105m;

    location /static/ {
        alias /var/www/my_site_prod_repo_new/staticfiles/;
    }

    location /media/ {
        return 404;
    }

    location /_protected_media/ {
        internal;
        alias /var/www/my_site_prod_repo_new/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=7776000, immutable";
        access_log off;
    }


    location /grafana/ {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    location /flower/static/ {
        rewrite ^/flower/static/(.*)$ /static/$1 break;
        proxy_pass http://127.0.0.1:15556;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /flower/ {
        rewrite ^/flower/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:15556;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'href="/static/' 'href="/flower/static/';
        sub_filter 'src="/static/' 'src="/flower/static/';
        sub_filter 'href="/workers"' 'href="/flower/workers"';
        sub_filter 'href="/tasks"' 'href="/flower/tasks"';
        sub_filter 'href="/broker"' 'href="/flower/broker"';
        sub_filter 'href="/"' 'href="/flower/"';
    }


    location /prometheus/ {
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19098;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    location /celery-metrics/ {
        rewrite ^/celery-metrics/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9540;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
            }
}

