server {
    listen 3000 ssl;
    listen [::]:3000 ssl;
    server_name rgavanp.kdns.fr 38.76.217.137;
    ssl_certificate /var/www/my_site_prod_repo_new/ssl/fullchain.pem;
    ssl_certificate_key /var/www/my_site_prod_repo_new/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    error_page 497 =301 https://$host:3000$request_uri;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $host;
